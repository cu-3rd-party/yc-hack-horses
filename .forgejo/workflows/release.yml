name: Release

on:
  push:
    tags: ['v*']

# Драфт-релиз по тегу v*: backend (linux-amd64), desktop (.deb/.AppImage),
# mobile (APK). Публикация релиза — вручную (draft остаётся до проверки).
jobs:
  release-backend:
    name: backend-linux-amd64
    runs-on: homelab-docker
    container: ghcr.io/catthehacker/ubuntu:act-24.04
    options: --cpus 2 --memory 2g
    env:
      GOMAXPROCS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Build node (linux-amd64)
        working-directory: backend
        # CGO включён: YOLO-инференс тянет onnxruntime (cgo), бинарник динамический
        run: CGO_ENABLED=1 GOFLAGS="-p=4" go build -o ../bin/node ./cmd/node
      - name: Pack backend bundle
        run: |
          tar czf backend-linux-amd64.tar.gz \
            -C bin node \
            -C .. backend/config.example.yaml README.md
      - uses: actions/upload-artifact@v3
        with:
          name: backend-linux-amd64
          path: backend-linux-amd64.tar.gz

  release-node-rpm:
    name: node RPM (linux-amd64)
    needs: [release-backend]
    runs-on: homelab-docker
    container: ghcr.io/catthehacker/ubuntu:act-24.04
    options: --cpus 2 --memory 2g
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v3
        with:
          name: backend-linux-amd64
          path: artifact
      - name: Build RPM
        env:
          VERSION: ${{ github.ref_name }}
        # В rpm кладём бинарь + libonnxruntime.so (NuGet, как в download-yolo-model.sh) +
        # systemd-юнит и пример конфига: «скачал — работает», модель качается при старте в DATA_DIR.
        run: |
          set -e
          apt-get update && apt-get install -y --no-install-recommends rpm
          ver=${VERSION#v}
          mkdir -p rpmbuild/SOURCES rpmbuild/SPECS
          tar xzf artifact/backend-linux-amd64.tar.gz -C artifact
          cp artifact/node rpmbuild/SOURCES/
          cp backend/config.example.yaml rpmbuild/SOURCES/node.example.yaml
          curl -fsSL -o /tmp/ort.nupkg https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/1.31.1/microsoft.ml.onnxruntime.1.31.1.nupkg
          python3 - <<'EOF'
          import zipfile, shutil
          with zipfile.ZipFile("/tmp/ort.nupkg") as z, z.open("runtimes/linux-x64/native/libonnxruntime.so") as s, open("rpmbuild/SOURCES/libonnxruntime.so.1.31.1", "wb") as d:
              shutil.copyfileobj(s, d)
          EOF
          cp infra/systemd/yc-hack-horses-node.service rpmbuild/SOURCES/
          sed -e "s/@VERSION@/$ver/g" infra/packaging/node.spec.in > rpmbuild/SPECS/yc-hack-horses-node.spec
          rpmbuild -ba --define "_topdir $PWD/rpmbuild" rpmbuild/SPECS/yc-hack-horses-node.spec
          cp rpmbuild/RPMS/x86_64/yc-hack-horses-node-*.rpm .
      - uses: actions/upload-artifact@v3
        with:
          name: node-rpm
          path: yc-hack-horses-node-*.rpm

  release-frontend-dist:
    name: frontend dist (Electron)
    runs-on: homelab-docker
    container: ghcr.io/catthehacker/ubuntu:act-24.04
    options: --cpus 2 --memory 2g
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build client bundle
        env:
          NODE_OPTIONS: --max-old-space-size=2048
        run: |
          cd app
          npm ci --maxsockets=4 --cache ~/.npm
          npm run build
      - uses: actions/upload-artifact@v3
        with:
          name: app-dist
          path: app/dist

  release-desktop:
    name: Electron desktop (.deb / .AppImage)
    runs-on: homelab-docker
    container: ghcr.io/catthehacker/ubuntu:act-24.04
    options: --cpus 2 --memory 4g
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Package Linux app
        working-directory: app
        run: |
          apt-get update && apt-get install -y --no-install-recommends fakeroot libarchive-tools
          npm ci --maxsockets=4
          npm run package:linux
      - uses: actions/upload-artifact@v3
        with:
          name: desktop-bundles
          path: |
            app/release/*.deb
            app/release/*.AppImage

  release-mobile:
    name: mobile (android APK)
    runs-on: homelab-docker
    container: ghcr.io/catthehacker/ubuntu:act-24.04
    # RN-сборка (gradle JVM 2G + clang-компиляция hermes/codegen C++) в 4g ловит
    # cgroup OOM — «Gradle build daemon disappeared». 6g + docker_dind 8g хватает.
    options: --cpus 2 --memory 6g
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build APK (expo prebuild + gradle)
        # Java 17 + Android SDK ставится sdkmanager'ом в-job; при отсутствии
        # релизного ключа подписываем debug-ключом (тестовый APK, не Play-ready).
        run: |
          if [ ! -f mobile/package.json ]; then echo 'mobile/ отсутствует — skip'; exit 0; fi
          apt-get update && apt-get install -y --no-install-recommends openjdk-17-jdk-headless unzip wget
          sdk=/opt/android-sdk; mkdir -p "$sdk"
          export ANDROID_HOME="$sdk" ANDROID_SDK_ROOT="$sdk"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/tools.zip
          unzip -q /tmp/tools.zip -d "$sdk/cmdline-tools"
          mv "$sdk/cmdline-tools/cmdline-tools" "$sdk/cmdline-tools/latest"
          export PATH="$sdk/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$sdk" --licenses >/dev/null || true
          sdkmanager --sdk_root="$sdk" "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null
          cd mobile
          npm ci --maxsockets=4 --cache ~/.npm
          npx expo prebuild -p android --no-install
          cd android
          # ninja параллелит по числу ядер хоста и строит все 4 ABI — десятки
          # форкнутых clang++ роняют cgroup по памяти (killed java, "Gradle build
          # daemon disappeared"). Строим arm64 (тестовый APK) и ограничиваем
          # воркеры лимитом --cpus 2.
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs=-Xmx2048m \
            -Dorg.gradle.workers.max=2 -PreactNativeArchitectures=arm64-v8a
      - uses: actions/upload-artifact@v3
        with:
          name: mobile-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk

  release-publish:
    name: Create draft release
    needs: [release-backend, release-node-rpm, release-desktop, release-mobile]
    # backend обязателен; desktop/mobile не блокируют релиз (если упали — артефактов просто нет)
    if: always() && !cancelled() && needs.release-backend.result == 'success'
    runs-on: homelab-docker
    container: ghcr.io/catthehacker/ubuntu:act-24.04
    options: --cpus 2 --memory 2g
    steps:
      - uses: actions/download-artifact@v3
        with:
          path: artifacts
      - name: Create draft release and upload assets
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          # Драфт-релиз по тегу (тег уже запушен); артефакты прикладываются multipart-ом.
          rid=$(curl -sS -H "Authorization: token $RELEASE_TOKEN" -X POST \
            "https://git.cu3rd.ru/api/v1/repos/$REPO/releases" \
            -H 'Content-Type: application/json' \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"draft\":true}" \
            | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d.get("id",""))')
          if [ -z "$rid" ]; then echo 'не удалось создать релиз' >&2; exit 1; fi
          # Только финальные артефакты: tar.gz/rpm/apk/deb/AppImage. find по всем
          # файлам тащит распакованные внутренности бандлов (bcmap/wasm дистрибутивов).
          find artifacts -type f | grep -E '\.(tar\.gz|rpm|apk|deb|AppImage)$' | while read -r f; do
            name=$(basename "$f")
            curl -sS -H "Authorization: token ${RELEASE_TOKEN}" -X POST \
              "https://git.cu3rd.ru/api/v1/repos/$REPO/releases/$rid/assets?name=$name" \
              -F "attachment=@$f" | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d.get("name") or d)'
          done
          echo "release id: $rid (draft)"
