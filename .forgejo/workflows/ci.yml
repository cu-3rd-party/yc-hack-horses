name: Test, publish and deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Раннер тянет только локально закэшированные act-образы — все джобы на act-24.04
# с setup-* шагами (как в paste), готовых образов golang/node недоступны.
jobs:
  changes:
    name: Detect changed containers
    runs-on: homelab-docker
    container: ghcr.io/catthehacker/ubuntu:act-24.04
    options: --cpus 2 --memory 2g
    outputs:
      image: ${{ steps.changes.outputs.image }}
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compare build inputs
        id: changes
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BEFORE_SHA: ${{ github.event.before }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .ci/changes.py

  build-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: homelab-docker
    container: ghcr.io/catthehacker/ubuntu:act-24.04
    options: --cpus 2 --memory 2g
    env:
      GOMAXPROCS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ hashFiles('backend/go.sum') }}
      - name: Test and build node (sqlite)
        working-directory: backend
        run: |
          go vet ./...
          go run mvdan.cc/gofumpt@v0.7.0 -l .
          go build ./...
          go test ./...

  build-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: homelab-docker
    container: ghcr.io/catthehacker/ubuntu:act-24.04
    options: --cpus 2 --memory 2g
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('app/package-lock.json') }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Check and package Electron client
        working-directory: app
        env:
          GOMAXPROCS: '2'
          NODE_OPTIONS: --max-old-space-size=2048
        run: |
          npm ci --maxsockets=4
          npm run lint
          npm test
          npm run build
          npx --no-install electron-builder --linux dir --publish never
      - name: Check Apple Silicon node cross-build
        if: github.event_name == 'pull_request'
        env:
          GOMAXPROCS: '2'
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends clang lld
          bash app/scripts/build-node.sh darwin arm64
          file app/build/node/darwin-arm64/loshid-node | grep -q arm64

  build-image:
    needs: [changes, build-backend, build-frontend]
    # docker CLI есть только в act-образе; сборка/пуш — отдельной джобой.
    if: >-
      always() && !cancelled() &&
      needs.changes.outputs.image == 'true' &&
      (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped') &&
      (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped')
    runs-on: homelab-docker
    container: ghcr.io/catthehacker/ubuntu:act-24.04
    options: --cpus 2 --memory 2g
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and smoke-test web image
        env:
          IMAGE: git.cu3rd.ru/cu3rd/yc-hack-horses:${{ github.sha }}
        run: |
          set -eu
          docker build --cpuset-cpus 0-3 --memory 4g -f backend/Dockerfile -t "$IMAGE" .
          journal=$(docker run -d -e API_DOCS_ENABLED=true "$IMAGE")
          trap 'docker rm -fv "$journal" >/dev/null' EXIT
          docker run --rm -i --network "container:$journal" node:22-bookworm-slim node --input-type=module - < .ci/smoke-web.mjs
      - name: Publish web image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          REGISTRY_USER: ${{ vars.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          IMAGE: git.cu3rd.ru/cu3rd/yc-hack-horses:${{ github.sha }}
        run: |
          set -eu
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$REGISTRY_TOKEN" | docker login git.cu3rd.ru --username "$REGISTRY_USER" --password-stdin
          docker push "$IMAGE"

  deploy:
    needs: [changes, build-image]
    # always() нужен, чтобы skipped у неизменившегося компонента не блокировал джобу.
    if: >-
      always() && !cancelled() &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/master' &&
      needs.changes.result == 'success' &&
      needs.build-image.result == 'success'
    runs-on: homelab-docker
    # Подтверждает происхождение доставки: PR с новым тегом сливает self-service-approver.
    # Без этого каждая доставка ждала бы ревью SRE.
    enable-openid-connect: true
    container: ghcr.io/catthehacker/ubuntu:act-24.04
    options: --cpus 2 --memory 2g
    steps:
      - name: Propose self-service deployment (web)
        uses: https://git.cu3rd.ru/cu3rd/self-service/actions/deploy@master
        with:
          project: yc-hack-horses
          environment: prod
          app: web
          tag: ${{ github.sha }}
          secrets-json: ${{ toJSON(secrets) }}
          variables-json: ${{ toJSON(vars) }}
          delivery-token: ${{ secrets.SELF_SERVICE_DELIVERY_TOKEN }}
