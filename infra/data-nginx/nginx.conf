server {
    listen 8080;
    root /data;

    # Индекс каталогов: нужен, чтобы скрывать имена файлов в каталогах
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    # Токены и служебные файлы (например .sites-access) наружу не отдаём
    location ~ /\. { deny all; }

    location / {
        try_files $uri $uri/ =404;
    }
}
