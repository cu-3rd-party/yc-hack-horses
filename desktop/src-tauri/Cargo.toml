[package]
name = "yc-hack-horses-desktop"
version = "0.1.0"
description = "Desktop shell yc-hack-horses: React UI + Go-нода как sidecar"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
yc-hack-horses-node-sidecar = { path = "../sidecar" }

[profile.release]
strip = true
lto = true
codegen-units = 1
