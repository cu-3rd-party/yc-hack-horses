# Пример конфигурации ноды (без секретов — реальные значения в node.yaml вне git)
node:
  id: ""                    # UUID, генерируется при первой инициализации, если пусто
  data_dir: "./data"
  role_hint: "local"        # только подсказка для CLI; central определяется hostname+mTLS, НЕ конфигом

storage:
  driver: "sqlite"          # sqlite | postgres
  dsn: "./data/node.db"

network:
  listen_addr: "127.0.0.1:8080"      # REST/WS для локального UI — loopback по умолчанию
  grpc_listen_addr: "0.0.0.0:9443"   # межнодовый gRPC
  # grpc_multiplex: gRPC и REST на одном listen_addr (h2c). Для central-ноды
  # за Traefik ingress: TLS терминируется на ingress, клиентский серт
  # прокидывается middleware passTLSClientCert в X-Forwarded-Tls-Client-Cert
  # и проверяется против security.ca_file. Требует security.ca_file.
  grpc_multiplex: false
  mdns_enabled: true
  service_name: "_przewalski-node._tcp.local"

security:
  cert_file: ""             # клиентский серт ноды
  key_file: ""
  ca_file: ""               # CA, которому доверяем пиров
  central_hostname: "yc-hack-horses.cu3rd.ru"

sync:
  enabled: true
  central_url: "https://yc-hack-horses.cu3rd.ru"   # central считается только при успешной TLS-проверке этого hostname
  batch_size: 256
  interval: "30s"

enrollment:
  # Автоматическая выдача клиентских сертификатов (ADR-0007 amended, ADR-0014).
  # Включается ТОЛЬКО на central-ноде; локальные ноды держат выключенным.
  enabled: false
  token: ""                # enrollment-токен (env ENROLLMENT_TOKEN)
  ca_key_file: ""          # приватный ключ CA подписи (env ENROLLMENT_CA_KEY_FILE)
  cert_days: 365           # срок жизни выдаваемого leaf-серта (ADR-0007 amended)

api:
  # Документация REST API (Scalar UI на /api/scalar + openapi.yaml).
  # Включать только на central-ноде (self-service деплой); локальные ноды — false.
  docs_enabled: false

inference:
  comparison_url: ""       # при engine: yolo пустое значение включает локальное сравнение; URL выбирает внешний сервис
  engine: "unavailable"     # unavailable | reference | yolo (ADR-0012)
  # engine: yolo — детекция лошади YOLO ONNX + кропы; веса НЕ в git:
  # bash infra/scripts/download-yolo-model.sh
  # model_path: "infra/models/yolov8n.onnx"
  # runtime_lib: "infra/models/libonnxruntime.so.1.31.1"
  # reid_model_dir: "infra/models/reid-v1"  # поиск по MegaDescriptor-L-384, измерения по маскам для просмотра
